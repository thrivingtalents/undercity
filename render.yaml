# Render blueprint — https://render.com/docs/blueprint-spec
#
# A single always-on web service with a persistent disk. UNDERCITY holds
# authoritative game state in memory and broadcasts it over websockets, so it
# must NOT be scaled to multiple instances: a second instance would hold its
# own copy of every game and clients would land on whichever one the load
# balancer picked. One instance, one source of truth.

services:
  - type: web
    name: undercity
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # needs a paid plan: free instances sleep, and a
                           # sleeping server ends a live session
    region: singapore      # closest to KL; move if your cohorts are elsewhere
    numInstances: 1        # see the note above — do not raise this
    healthCheckPath: /healthz
    autoDeployTrigger: commit

    disk:
      name: undercity-data
      mountPath: /var/data # SQLite + one runlog.jsonl per session
      sizeGB: 5

    envVars:
      - key: NODE_ENV
        value: production
      - key: MODE
        value: hosted
      - key: DATA_DIR
        value: /var/data
      - key: SECURE_COOKIES
        value: "1"

      # Master admin, seeded on first boot if the account does not exist yet.
      # Accounts live on the persistent disk and survive redeploys; this only
      # saves you needing shell access for the very first sign-in. An existing
      # account is never modified, so changing the password in the app sticks.
      - key: ADMIN_EMAIL
        value: thrivingtalentsgpt1@gmail.com
      - key: ADMIN_NAME
        value: Thriving Talents
      # Set this in the Render dashboard, not here. Leave it unset and the
      # first boot generates one and prints it to the deploy log, once.
      - key: ADMIN_PASSWORD
        sync: false
