<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAVEN-9 — CITY WALL</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%230a0c0e%27/%3E%3Ccircle cx=%278%27 cy=%278%27 r=%274%27 fill=%27%23E8B33A%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/shared/base.css">
<link rel="stylesheet" href="/assets/wall/wall.css">
</head>
<body>
<!--
  The participant Big Screen. Display-only: there is no button here and
  nothing to type. Four bands — the command bar, an alert strip drawn only
  while something needs the room, the city beside its six health monitors,
  and COM's city broadcast. Every value comes from the server's frame; the
  formatting rules are shared with the tests in /shared/bigscreen.js.
-->
<div class="wall" id="wall" data-core="healthy">

  <!--
    1. COMMAND BAR. Left: who the city is and which round it is — a number,
    never a name. Centre: CORE STABILITY, the
    loudest thing on the bar. Right: the countdown, whose label says what it
    is counting to, then the tags and the LIVE feed.
  -->
  <header class="hud">
    <div class="hud-brand">
      <div class="hud-mark">
        <span class="hud-sub">SUBTERRANEAN CONTINUITY AUTHORITY</span>
      </div>
      <div class="hud-phase" id="hud-phase">
        <span class="k" id="phase-label">PHASE</span>
        <b id="phase-value">—</b>
      </div>
    </div>

    <div class="hud-core" id="hud-core" data-state="stable">
      <span class="k">CORE STABILITY</span>
      <b><span id="core-output">--</span><small>%</small></b>
      <span class="core-state" id="core-state">—</span>
    </div>

    <div class="hud-right">
      <div class="hud-time" id="hud-time">
        <span class="k" id="time-label">MASTER TIME</span>
        <b class="clock" id="round-clock">--:--</b>
      </div>
      <div class="hud-tags">
        <span class="tag tag-blackout" id="tag-blackout" hidden>ROLLING BLACKOUT</span>
        <span class="tag tag-sensors" id="tag-sensors" hidden>SENSORS OFFLINE</span>
      </div>
      <div class="live" id="live" data-status="down"><span class="dot"></span><span class="live-text" id="live-text">CONNECTING</span></div>
    </div>
  </header>

  <!-- 2. ALERT STRIP: only while something needs the room; critical sectors before transfers -->
  <section class="alerts" id="alerts" hidden></section>

  <!-- 3. THE CITY and its six monitors -->
  <main class="main">
    <section class="city" id="city" data-map="image">
      <!-- HUD frame: four corner brackets and one slow scan, drawn in CSS. Detail, never clutter. -->
      <div class="city-frame" aria-hidden="true"></div>
      <div class="city-scan" aria-hidden="true"></div>
      <!--
        The city animation. It plays under the SVG, on the same 16:9 box the
        artwork is traced on, so every callout, tint, badge and route still
        lands where it was drawn. No controls, no sound, no chrome: the room
        watches it, nobody operates it. The painted map stays in the SVG below
        and is what shows until the video is really playing — and what keeps
        showing if it cannot load. Its source and playback flags come from
        config/big-screen-map.json.
      -->
      <video id="map-video" class="map-video" autoplay loop muted playsinline preload="auto"
             disablepictureinpicture disableremoteplayback tabindex="-1" aria-hidden="true"></video>
      <svg id="map" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMid meet" role="img" aria-label="HAVEN-9 underground city"></svg>
      <!--
        The state overlay (2026-09-21). Layer 2 is the calibrated sector
        regions; layer 3 is their status words. Both are sized by
        shared/map-overlay.js to the rectangle the VIDEO IMAGE actually
        occupies — not to this panel, which letterboxes the clip whenever the
        screen is not 16:9. Empty until mapConfig/haven9-map-regions.json says
        where a sector is: a missing overlay is honest, a guessed one lies.
      -->
      <svg id="map-state" class="map-state" viewBox="0 0 1 1" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div id="map-words" class="map-words" aria-hidden="true"></div>
      <div class="final-count" id="final-count" hidden></div>
      <!-- the round's upkeep pass, for 3.5 seconds -->
      <!-- The round marker. Three seconds, one number, no description of
           what the round holds — and it blocks nothing: the clock runs, the
           faults decay and every console stays live underneath it. -->
      <div class="round-flash" id="round-flash" hidden><b id="round-flash-text"></b></div>
      <div class="cycle-flash" id="cycle-flash" hidden>
        <b id="cycle-flash-title"></b>
        <span id="cycle-flash-sub"></span>
      </div>
    </section>

    <!-- Six sectors, always in the same order, each one identity first and condition second. -->
    <aside class="health" id="health">
      <div class="h-head">
        <h2 class="h-title">SECTOR STATUS</h2>
        <span class="h-reports" id="h-reports">REPORTS 0/6</span>
      </div>
      <div class="h-cards" id="h-cards"></div>
    </aside>
  </main>

  <!-- 4. CITY BROADCAST: what COM told the city, readable from the back of the room -->
  <!--
    4. CITY BROADCAST. A thin standby line while COM has said nothing, and a
    band that opens once when COM speaks. It never scrolls and never loops.
  -->
  <footer class="broadcast" id="broadcast" data-state="none">
    <div class="bc-tag">📡 CITY BROADCAST</div>
    <div class="bc-body">
      <b class="bc-head" id="bc-head">STANDBY</b>
      <span class="bc-msg" id="bc-msg"></span>
    </div>
    <div class="bc-by" id="bc-by"></div>
  </footer>

  <!-- takeovers: the city stays faintly visible behind each -->
  <div class="takeover alert" id="alert-full" hidden>
    <div class="t-inner">
      <div class="t-tag">MAJOR EMERGENCY</div>
      <div class="t-title" id="alert-title"></div>
      <div class="t-sub" id="alert-sub"></div>
      <div class="t-big" id="alert-big"></div>
    </div>
  </div>

  <div class="takeover shock" id="core-shock" hidden>
    <div class="t-inner">
      <div class="t-tag">GEOTHERMAL CORE</div>
      <div class="t-title">CORE STABILITY FALLING</div>
      <div class="t-big" id="shock-value">--%</div>
    </div>
  </div>


  <div class="takeover paused" id="paused" hidden>
    <div class="t-inner">
      <div class="t-title">SIMULATION PAUSED</div>
      <div class="t-sub">ALL CLOCKS HELD — AWAIT FACILITATOR</div>
    </div>
  </div>

  <!-- corner chrome -->

</div>
<script src="/shared/ws.js"></script>
<script src="/shared/map-overlay.js"></script>
<script src="/shared/bigscreen.js"></script>
<script src="/assets/wall/wall.js"></script>
</body>
</html>
